name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            os: macos
            arch: arm64
            bundles: "dmg,app"
          - platform: macos-14
            target: x86_64-apple-darwin
            os: macos
            arch: x64
            bundles: "dmg,app"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch: x64
            bundles: "msi,nsis"
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x64
            bundles: "deb,appimage"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install deps (ubuntu)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build Tauri (installer + bundles)
        shell: bash
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Package macOS portable (zip .app)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set +o pipefail
          APP=$(find target/${{ matrix.target }}/release/bundle -name "*.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Found app: $APP"
            ditto -c -k --keepParent "$APP" "easytube-macos-${{ matrix.arch }}-portable.zip"
          else
            echo "No .app found, skipping portable zip"
          fi

      - name: Package Windows portable (zip release dir)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $src = "target/${{ matrix.target }}/release"
          if (Test-Path $src) {
            Get-ChildItem $src -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -notin '.pdb', '.lib', '.exp' } |
              Compress-Archive -DestinationPath "easytube-windows-x64-portable.zip"
          } else {
            Write-Host "$src not found, skipping"
          }

      - name: Package Linux portable (copy AppImage)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set +o pipefail
          IMG=$(find target/${{ matrix.target }}/release/bundle -name "*.AppImage" 2>/dev/null | head -1)
          if [ -n "$IMG" ]; then
            echo "Found AppImage: $IMG"
            cp "$IMG" "easytube-linux-${{ matrix.arch }}-portable.AppImage"
          else
            echo "No AppImage found, skipping"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "EasyTube ${{ github.ref_name }}"
          body: |
            ## EasyTube ${{ github.ref_name }}

            A desktop YouTube/Bilibili downloader with MCP server support.

            ### Installer downloads
            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `.dmg` |
            | macOS (Intel) | `.dmg` |
            | Windows (x64) | `.msi` |
            | Linux (x64) | `.deb` |

            ### Portable downloads (no install needed)
            | Platform | File |
            |---|---|
            | macOS | `.zip` — extract and run `easytube.app` |
            | Windows | `.zip` — extract and run `easytube.exe` |
            | Linux | `.AppImage` — `chmod +x` and run |

            See [README](https://github.com/Yomisana/EasyTube#readme) for setup instructions.
          draft: true
          prerelease: false
          files: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            easytube-*-portable.*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
