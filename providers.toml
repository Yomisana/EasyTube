# yt-dlp / ffmpeg binary download sources
# Single source of truth — no hardcoded detection in code.

[ytdlp]
pinned_version = "2025.07.21"

[ytdlp.assets.windows_x86_64]
url = "https://github.com/yt-dlp/yt-dlp/releases/download/{version}/yt-dlp.exe"

[ytdlp.assets.macos_x86_64]
url = "https://github.com/yt-dlp/yt-dlp/releases/download/{version}/yt-dlp_macos"

[ytdlp.assets.macos_aarch64]
url = "https://github.com/yt-dlp/yt-dlp/releases/download/{version}/yt-dlp_macos"

[ytdlp.assets.linux_x86_64]
url = "https://github.com/yt-dlp/yt-dlp/releases/download/{version}/yt-dlp_linux"

[ffmpeg]
pinned_version = "7.1"

[ffmpeg.assets.windows_x86_64]
url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"

[ffmpeg.assets.macos_x86_64]
